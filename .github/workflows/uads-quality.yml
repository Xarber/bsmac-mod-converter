name: Source quality
on:
  pull_request:
    branches: [testing, beta, main]
  push:
    branches: [testing]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e . pytest coverage
      - run: python scripts/validate-uads.py
      - run: python -m compileall -q implementation/python tests scripts
      - run: coverage run --branch --source=bsmac_converter -m pytest tests -q
      - run: coverage report
      - run: git diff --check
      - run: python scripts/check-source-boundary.py
